name: repair-hoc017-name

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-hoc017-name.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Replace superseded HOC-017 service name
        shell: python
        run: |
          from pathlib import Path
          path = Path('management-information-and-kpi-setup.html')
          text = path.read_text(encoding='utf-8')
          old = 'Management Information &amp; KPI Setup'
          new = 'Management Reporting Setup'
          count = text.count(old)
          if count == 0:
              raise SystemExit('HOC-017 superseded name not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          Path('.github/workflows/repair-hoc017-name.yml').unlink()
      - name: Commit bounded HOC-017 name correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add management-information-and-kpi-setup.html .github/workflows/repair-hoc017-name.yml
          git diff --cached --check
          git commit -m "Correct HOC-017 service name"
          git push origin HEAD:main
