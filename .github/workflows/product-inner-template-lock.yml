name: Product Inner Template Lock

on:
  push:
    branches:
      - hoc-product-template-inner-normalise-20260914

permissions:
  contents: write

jobs:
  normalise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hoc-product-template-inner-normalise-20260914
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - name: Normalise inner product template without rewriting copy
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup, Tag
          import ast, re

          root=Path('.')
          tree=ast.parse((root/'scripts/product_page_standardisation_check.py').read_text(encoding='utf-8'))
          routes=[]
          for node in tree.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id=='EXPECTED_PRICES':
                          routes=list(ast.literal_eval(node.value).keys())
          assert len(routes)==53, len(routes)

          special={'product-hook','product-audience','product-price','product-scope-line','product-turnaround','product-trust-line','actions','product-visual'}
          for route in routes:
              p=root/route
              soup=BeautifulSoup(p.read_text(encoding='utf-8'),'html.parser')
              hero=soup.select_one('section.product-hero > .shell')
              if not hero: raise SystemExit(f'{route}: hero shell missing')

              # Fixed hero slots. Preserve every existing element and word.
              identity=soup.new_tag('div'); identity['class']=['product-hero-identity']
              offer=soup.new_tag('div'); offer['class']=['product-hero-offer']
              visuals=[]
              for el in [x for x in list(hero.children) if isinstance(x,Tag)]:
                  cls=set(el.get('class',[]))
                  if el.name=='h1' or 'product-hook' in cls or 'product-audience' in cls:
                      identity.append(el.extract())
                  elif el.name=='p' and not (cls & special):
                      if not cls: el['class']=['intro']
                      identity.append(el.extract())
                  elif cls & {'product-price','product-scope-line','product-turnaround','product-trust-line','actions'}:
                      offer.append(el.extract())
                  elif 'product-visual' in cls:
                      visuals.append(el.extract())
                  else:
                      identity.append(el.extract())
              for child in list(hero.children):
                  if isinstance(child,Tag): child.extract()
              hero.append(identity); hero.append(offer)
              for v in visuals: hero.append(v)

              # Fixed internal section header/body slots.
              for section in soup.select('main#main > section.product-section'):
                  shell=section.find('div',class_='shell',recursive=False)
                  if not shell: continue
                  h2=shell.find('h2',recursive=False)
                  if not h2: continue
                  if shell.find('div',class_='product-section-heading',recursive=False): continue
                  head=soup.new_tag('div'); head['class']=['product-section-heading']
                  head.append(h2.extract())
                  # Any pre-body direct H3/section-lead copy belongs to the standard heading slot.
                  for el in [x for x in list(shell.children) if isinstance(x,Tag)]:
                      cls=set(el.get('class',[]))
                      if el.name=='h3' or 'section-lead' in cls:
                          head.append(el.extract())
                      else:
                          break
                  body=soup.new_tag('div'); body['class']=['product-section-body']
                  for el in [x for x in list(shell.children) if isinstance(x,Tag)]:
                      body.append(el.extract())
                  shell.append(head); shell.append(body)

              # Make list-based recognition content use the same card grid without changing wording.
              for grid in soup.select('.recognition-grid'):
                  grid['class']=['recognition-grid']
                  articles=grid.find_all('article',recursive=False)
                  if len(articles)==1:
                      ul=articles[0].find('ul',recursive=False)
                      other=[x for x in articles[0].find_all(recursive=False) if x is not ul]
                      if ul and not other:
                          old=articles[0]
                          new=[]
                          for li in ul.find_all('li',recursive=False):
                              a=soup.new_tag('article'); q=soup.new_tag('p')
                              for c in list(li.contents): q.append(c.extract() if hasattr(c,'extract') else c)
                              a.append(q); new.append(a)
                          old.extract()
                          for a in new: grid.append(a)

              # Standard component classes everywhere.
              for grid in soup.select('.deliverable-groups'):
                  grid['class']=['deliverable-groups','generic-deliverables']
                  for article in grid.find_all('article',recursive=False):
                      article['class']=['product-card']
              for article in soup.select('.recognition-grid > article'):
                  article['class']=['product-card']
              for facts in soup.select('.service-facts'):
                  facts['class']=['service-facts','standard-service-facts']
              for panel in soup.select('.cta-panel'):
                  panel['class']=['shell','cta-panel']
                  copy=panel.find('div',class_='copy',recursive=False)
                  if copy: copy['class']=['copy','cta-copy']

              html=str(soup)
              # Restore stable attribute order expected by existing production checks.
              html=re.sub(r'<meta content="noindex,nofollow" name="robots"\s*/?>','<meta name="robots" content="noindex,nofollow">',html)
              html=re.sub(r'<meta content="([^"]+)" http-equiv="Content-Security-Policy"\s*/?>',lambda m:'<meta http-equiv="Content-Security-Policy" content="'+m.group(1)+'">',html)
              html=re.sub(r'<link href="([^"]+)" rel="stylesheet"\s*/?>',r'<link rel="stylesheet" href="\1">',html)
              p.write_text(html,encoding='utf-8')

          cssp=root/'assets/hoc-service.css'
          css=cssp.read_text(encoding='utf-8')
          marker='/* CANONICAL INNER PRODUCT TEMPLATE 2026-09-14 */'
          block='''\n\n/* CANONICAL INNER PRODUCT TEMPLATE 2026-09-14 */\nbody.canonical-product-page .product-hero>.shell{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,.62fr);column-gap:56px;align-items:start}\nbody.canonical-product-page .product-hero-identity,body.canonical-product-page .product-hero-offer{min-width:0}\nbody.canonical-product-page .product-hero-identity .intro,body.canonical-product-page .product-hero-identity>p:not(.product-hook):not(.product-audience){max-width:760px;font-size:19px;line-height:1.6;color:#31404A}\nbody.canonical-product-page .product-hero-offer{padding:26px 28px;background:#fff;border:1px solid var(--stone);border-top:4px solid var(--carol-blue)}\nbody.canonical-product-page .product-hero-offer .product-price{margin-top:0}\nbody.canonical-product-page .product-hero-offer .actions{margin-top:24px}\nbody.canonical-product-page .product-visual{grid-column:1/-1}\nbody.canonical-product-page .product-section-heading{max-width:820px;margin-bottom:28px}\nbody.canonical-product-page .product-section-heading>h2{margin-bottom:12px}\nbody.canonical-product-page .product-section-heading>h3{font-size:18px;margin:0 0 8px;color:var(--carol-blue)}\nbody.canonical-product-page .product-section-heading>.section-lead{margin-bottom:0}\nbody.canonical-product-page .product-section-body{min-width:0}\nbody.canonical-product-page .recognition-grid,body.canonical-product-page .deliverable-groups{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}\nbody.canonical-product-page .product-card{background:#fff;border:1px solid var(--stone);border-top:3px solid var(--carol-blue);padding:22px 24px;min-width:0}\nbody.canonical-product-page .product-card h3{margin:0 0 8px}\nbody.canonical-product-page .product-card p:last-child,body.canonical-product-page .product-card ul:last-child{margin-bottom:0}\nbody.canonical-product-page .bounded-review .product-section-body{max-width:900px}\nbody.canonical-product-page .cta-panel{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:32px}\n@media(max-width:760px){body.canonical-product-page .product-hero>.shell{grid-template-columns:1fr;row-gap:30px}body.canonical-product-page .product-hero-offer{padding:22px 20px}body.canonical-product-page .recognition-grid,body.canonical-product-page .deliverable-groups{grid-template-columns:1fr}body.canonical-product-page .cta-panel{grid-template-columns:1fr}}\n'''
          if marker not in css:
              cssp.write_text(css+block,encoding='utf-8')
          print('Normalised inner template slots for 53 product pages; product wording preserved.')
          PY
      - name: Commit normalised product pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' assets/hoc-service.css
          git commit -m "Normalise all 53 product pages to one visible template"
          git push origin HEAD:hoc-product-template-inner-normalise-20260914
