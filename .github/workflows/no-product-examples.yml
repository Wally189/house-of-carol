name: no-product-examples

on:
  push:
    branches:
      - main
      - 'hoc-website-remediation-*'
  pull_request:

permissions:
  contents: read

jobs:
  product-page-no-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce no case studies or examples on product pages
        run: python scripts/product_page_no_examples_check.py
