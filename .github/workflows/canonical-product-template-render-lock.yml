name: Canonical Product Template Render Lock

on:
  push:
    branches:
      - hoc-canonical-template-render-lock-20260914

permissions:
  contents: write

jobs:
  apply-template:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hoc-canonical-template-render-lock-20260914
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - run: python scripts/apply_canonical_product_template.py
      - name: Commit rendered template
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' assets/hoc-service.css
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Render all 53 product pages from one canonical template"
            git push origin HEAD:hoc-canonical-template-render-lock-20260914
          fi
