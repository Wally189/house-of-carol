name: product-meta-repair

on:
  push:
    branches:
      - product-page-standardisation-20260910

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout controlled branch
        uses: actions/checkout@v4
        with:
          ref: product-page-standardisation-20260910
          fetch-depth: 0
      - name: Add any missing product meta descriptions
        run: python scripts/add_missing_product_meta.py
      - name: Commit repair if required
        run: |
          if git diff --quiet -- '*.html'; then
            echo "No metadata repair required"
            exit 0
          fi
          git config user.name "House of Carol QA repair"
          git config user.email "53058801+Wally189@users.noreply.github.com"
          git add -- '*.html'
          git commit -m "Restore product meta descriptions"
          git push origin HEAD:product-page-standardisation-20260910
