name: repair-operations-cta

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-operations-cta.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore canonical final CTA structure
        shell: python
        run: |
          from pathlib import Path
          import re

          files = [
              'process-design-sprint.html',
              'shared-drive-cleanup.html',
              'management-information-and-kpi-setup.html',
              'customer-journey-and-service-operations-review.html',
              'customer-support-knowledge-base-build.html',
              'business-continuity-and-operational-readiness-pack.html',
              'decision-rights-and-governance-review.html',
              'complaints-and-redress-process-design.html',
              'evidence-and-marketing-claim-substantiation-review.html',
          ]

          for name in files:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              nav = text.find('<nav aria-label="Service navigation"')
              if nav < 0:
                  raise SystemExit(f'{name}: service navigation marker missing')
              start = text.rfind('<section class="product-section alt">', 0, nav)
              if start < 0:
                  raise SystemExit(f'{name}: final CTA section missing')
              segment = text[start:nav]
              if 'class="shell cta-panel"' in segment:
                  continue
              old = '<div class="shell"><div class="product-section-heading">'
              if old not in segment:
                  raise SystemExit(f'{name}: final CTA shell/heading pattern missing')
              segment = segment.replace(old, '<div class="shell cta-panel"><div class="copy cta-copy">', 1)
              body_split = '</div><div class="product-section-body">'
              if body_split not in segment:
                  raise SystemExit(f'{name}: final CTA body pattern missing')
              segment = segment.replace(body_split, '', 1)
              action = re.search(r'<div class="actions">(<a class="button" href="contact\.html">.*?</a>)</div>', segment, re.S)
              if not action:
                  raise SystemExit(f'{name}: final CTA action pattern missing')
              segment = segment[:action.start()] + '</div>' + action.group(1) + segment[action.end():]
              text = text[:start] + segment + text[nav:]
              path.write_text(text, encoding='utf-8')

          Path('.github/workflows/repair-operations-cta.yml').unlink()
      - name: Commit bounded repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add process-design-sprint.html shared-drive-cleanup.html management-information-and-kpi-setup.html customer-journey-and-service-operations-review.html customer-support-knowledge-base-build.html business-continuity-and-operational-readiness-pack.html decision-rights-and-governance-review.html complaints-and-redress-process-design.html evidence-and-marketing-claim-substantiation-review.html .github/workflows/repair-operations-cta.yml
          git diff --cached --check
          git commit -m "Restore canonical CTA structure for Operations pages"
          git push origin HEAD:main
