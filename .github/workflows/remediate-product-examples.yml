name: remediate-product-examples

on:
  push:
    branches:
      - hoc-website-remediation-no-product-examples-20260914

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded remediation
        run: python scripts/remediate_product_examples.py
      - name: Enforce no product-page examples
        run: python scripts/product_page_no_examples_check.py
      - name: Commit remediation
        run: |
          git config user.name "House of Carol QA Remediator"
          git config user.email "53058801+Wally189@users.noreply.github.com"
          git add -- '*.html'
          git diff --cached --quiet && exit 0
          git commit -m "Remove case studies and examples from product pages"
          git push
