name: product-alignment-apply-once

on:
  push:
    branches:
      - hoc-product-page-base-template-alignment-20260914
    paths:
      - scripts/apply_product_alignment_once.py
      - .github/workflows/product-alignment-apply-once.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hoc-product-page-base-template-alignment-20260914
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply canonical product-page alignment
        run: python scripts/apply_product_alignment_once.py
      - name: Remove one-time transformer
        run: rm scripts/apply_product_alignment_once.py .github/workflows/product-alignment-apply-once.yml
      - name: Commit candidate changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Align all 53 product pages to canonical base template'
          git push origin HEAD:hoc-product-page-base-template-alignment-20260914
