<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Bristol-inspired House of Carol panorama</title>
  <desc id="desc">An original geometric illustration evoking Bristol with Clifton Suspension Bridge, the Avon Gorge, colourful hillside houses, harbour water and hot-air balloons in a restrained inter-war poster style.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7ead7"/>
      <stop offset="1" stop-color="#dcebf3"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d5b78"/>
      <stop offset="1" stop-color="#3d7d94"/>
    </linearGradient>
    <pattern id="grain" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".6" fill="#0d315a" opacity=".08"/>
    </pattern>
  </defs>

  <rect width="1600" height="760" fill="url(#sky)"/>
  <circle cx="1280" cy="115" r="76" fill="#e4ad62" opacity=".78"/>
  <g fill="none" stroke="#0d315a" stroke-width="2" opacity=".16">
    <path d="M1190 115h180M1280 25v180"/>
    <circle cx="1280" cy="115" r="104"/>
  </g>

  <g opacity=".95">
    <path d="M0 440L170 330l125 46 145-150 150 160 130-84 145 104 170-158 146 172 150-80 190 102v318H0z" fill="#5c765f"/>
    <path d="M0 490L205 384l122 55 126-92 132 91 145-72 124 81 158-123 147 136 160-55 200 89v266H0z" fill="#314f48" opacity=".82"/>
  </g>

  <path d="M0 610C260 560 420 620 620 585c215-38 396 30 520-12 170-58 304-28 460-6v193H0z" fill="url(#water)"/>
  <path d="M0 642c210-34 408 22 602-14 194-36 346 27 521-12 167-38 297-25 477-5" fill="none" stroke="#f6efe3" stroke-width="6" opacity=".55"/>

  <!-- Clifton Suspension Bridge motif -->
  <g stroke="#eadcc8" fill="none" stroke-linecap="square">
    <path d="M190 390v230M760 390v230" stroke-width="24"/>
    <path d="M176 405h28M746 405h28" stroke-width="16"/>
    <path d="M202 415C345 337 604 337 748 415" stroke-width="8"/>
    <path d="M202 420h546" stroke-width="8"/>
    <g stroke-width="3" opacity=".95">
      <path d="M250 390v95M310 365v120M370 348v137M430 338v147M490 336v149M550 342v143M610 354v131M670 375v110M720 397v88"/>
    </g>
  </g>
  <path d="M150 610L188 420l62 190M700 610l60-190 40 190" fill="#29413d" opacity=".92"/>

  <!-- Harbourside hillside houses -->
  <g transform="translate(850 320)">
    <path d="M0 214l44-145 52 22 48-85 70 49 62-74 77 67 67-28 72 70 62-34 84 99v130H0z" fill="#f3eadc" opacity=".9"/>
    <g stroke="#173d55" stroke-width="4">
      <path d="M30 214v-104h74v104" fill="#c75f4b"/>
      <path d="M100 214V92h82v122" fill="#e2a64b"/>
      <path d="M178 214V76h88v138" fill="#6d98a2"/>
      <path d="M262 214V88h78v126" fill="#b34f55"/>
      <path d="M336 214V62h92v152" fill="#ddc36f"/>
      <path d="M424 214V92h82v122" fill="#4d8197"/>
      <path d="M502 214V72h96v142" fill="#c66f54"/>
    </g>
    <g fill="#f7f1e7" opacity=".9">
      <rect x="48" y="130" width="15" height="21"/><rect x="76" y="130" width="15" height="21"/>
      <rect x="122" y="118" width="16" height="23"/><rect x="151" y="118" width="16" height="23"/>
      <rect x="200" y="108" width="16" height="23"/><rect x="231" y="108" width="16" height="23"/>
      <rect x="281" y="122" width="15" height="21"/><rect x="311" y="122" width="15" height="21"/>
      <rect x="360" y="98" width="16" height="23"/><rect x="393" y="98" width="16" height="23"/>
      <rect x="447" y="122" width="15" height="21"/><rect x="477" y="122" width="15" height="21"/>
      <rect x="526" y="106" width="16" height="23"/><rect x="560" y="106" width="16" height="23"/>
    </g>
  </g>

  <!-- Harbour boats -->
  <g transform="translate(1040 610)">
    <path d="M0 40h180l-28 36H28z" fill="#f3e7d6" stroke="#173d55" stroke-width="5"/>
    <path d="M74 40V0h54l20 40" fill="#c75f4b" stroke="#173d55" stroke-width="5"/>
    <path d="M100 0v-42" stroke="#173d55" stroke-width="5"/>
    <path d="M100-40l38 18-38 10z" fill="#e3af57"/>
  </g>

  <!-- Hot-air balloons, a Bristol signature -->
  <g stroke="#0d315a" stroke-width="3">
    <g transform="translate(340 116)"><path d="M0 0c42 0 61 34 49 68-8 24-29 40-49 59-20-19-41-35-49-59C-61 34-42 0 0 0z" fill="#c75f4b"/><path d="M0 0v127" opacity=".35"/><rect x="-9" y="127" width="18" height="12" fill="#e6c790"/></g>
    <g transform="translate(560 165) scale(.72)"><path d="M0 0c42 0 61 34 49 68-8 24-29 40-49 59-20-19-41-35-49-59C-61 34-42 0 0 0z" fill="#e2a64b"/><path d="M0 0v127" opacity=".35"/><rect x="-9" y="127" width="18" height="12" fill="#e6c790"/></g>
    <g transform="translate(1450 175) scale(.58)"><path d="M0 0c42 0 61 34 49 68-8 24-29 40-49 59-20-19-41-35-49-59C-61 34-42 0 0 0z" fill="#5a8fa5"/><path d="M0 0v127" opacity=".35"/><rect x="-9" y="127" width="18" height="12" fill="#e6c790"/></g>
  </g>

  <!-- Inter-war framing -->
  <g fill="none" stroke="#0d315a" opacity=".32">
    <path d="M36 36h220v12H48v208H36z" stroke-width="3"/>
    <path d="M1564 724h-220v-12h208V504h12z" stroke-width="3"/>
  </g>
  <rect width="1600" height="760" fill="url(#grain)"/>
</svg>